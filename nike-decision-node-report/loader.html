<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision Node Shift Report</title><style>html,body{margin:0;background:#0f2234;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;font-size:14px;letter-spacing:.02em}</style></head><body><div class="loading" id="loading">Loading report…</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/wis-graph/wis-garden/3739e627fc117cd8ef9b57aa77018a5eb3d50b96/nike-decision-node-report/';const parts=await Promise.all([1,2,3,4,5].map(async i=>{const r=await fetch(base+`p${i}.txt`,{cache:'no-store'});if(!r.ok)throw new Error(`payload ${i}: ${r.status}`);return (await r.text()).trim()}));const s=parts.join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div class="loading" style="padding:24px;text-align:center">Failed to load report: '+String(e)+'</div>';console.error(e)}})();</script></body></html>
